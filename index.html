<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Push Ups Challenge Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f0f;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .dashboard-container {
            background: #1a1a1a;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            padding: 40px 20px;
            margin-top: 20px;
            margin-bottom: 40px;
            border: 1px solid #2a2a2a;
        }

        .stat-card {
            background: linear-gradient(135deg, #2d3561 0%, #1e2747 100%);
            color: #ffffff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #3a4570;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
        }

        .stat-card h3 {
            font-size: 13px;
            margin-bottom: 10px;
            opacity: 0.85;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #a8b5ff;
        }

        .stat-card .number {
            font-size: 42px;
            font-weight: bold;
            margin: 10px 0;
            color: #4a7fff;
        }

        .chart-container {
            position: relative;
            height: 400px;
            margin: 30px 0;
            background: #151515;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2a2a2a;
        }

        h1 {
            color: #ffffff;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 32px;
            text-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }

        .header-subtitle {
            color: #b0b0b0;
            text-align: center;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .section-title {
            color: #e0e0e0;
            margin-top: 30px;
            margin-bottom: 20px;
            font-weight: 600;
            border-bottom: 2px solid #4a7fff;
            padding-bottom: 10px;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .alert {
            border-radius: 8px;
            border: 1px solid #3a3a3a;
        }

        .alert-info {
            background-color: #1a2f4a;
            color: #a8d5ff;
            border-color: #2a4a6a;
        }

        .alert-danger {
            background-color: #4a1a1a;
            color: #ff9999;
            border-color: #6a2a2a;
        }

        .alert strong {
            color: #ffffff;
        }

        /* Chart.js custom styling */
        canvas {
            filter: invert(0);
        }

        .dark-mode-chart {
            background: transparent;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #4a7fff;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #667eea;
        }

        @media (max-width: 768px) {
            .dashboard-container {
                padding: 20px 15px;
            }

            h1 {
                font-size: 24px;
            }

            .stat-card {
                padding: 15px;
            }

            .stat-card .number {
                font-size: 32px;
            }

            .chart-container {
                height: 300px;
                padding: 15px;
            }

            .section-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1>🔥 2026 Push Ups Challenge</h1>
        <p class="header-subtitle">Track your daily progress and stay motivated!</p>
        
        <div class="dashboard-container">
            <div class="row">
                <div class="col-md-3 col-6">
                    <div class="stat-card">
                        <h3>Total Push Ups</h3>
                        <div class="number" id="totalPushUps">-</div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="stat-card">
                        <h3>Average Daily</h3>
                        <div class="number" id="averagePushUps">-</div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="stat-card">
                        <h3>Best Day</h3>
                        <div class="number" id="bestDay">-</div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="stat-card">
                        <h3>Current Streak</h3>
                        <div class="number" id="streak">-</div>
                    </div>
                </div>
            </div>

            <h2 class="section-title">Daily Progress</h2>
            <div class="chart-container">
                <canvas id="pushUpsChart"></canvas>
            </div>

            <h2 class="section-title">Weekly Breakdown</h2>
            <div class="chart-container">
                <canvas id="weeklyChart"></canvas>
            </div>

            <div class="alert alert-info" id="loadingStatus">
                <strong>Loading data...</strong> Pulling your latest push up data from the spreadsheet.
            </div>
        </div>
    </div>

    <script>
        let dailyChart = null;
        let weeklyChart = null;

        // Dark mode chart configuration
        const chartDefaults = {
            color: '#e0e0e0',
            borderColor: '#2a2a2a',
            gridColor: '#2a2a2a'
        };

        async function fetchDataFromSheet() {
            const sheetID = '14KN-KDPbNyXk-lSJ_yNqx4LhIdgiUp2lwoHEsEmJiPQ';
            const sheetName = 'RawData';
            
            try {
                // Using OpenSheet API - no API key required, no setup needed
                const apiUrl = `https://opensheet.elk.sh/${sheetID}/${sheetName}`;
                
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error('Failed to fetch data');
                }
                
                const data = await response.json();

                if (data && data.length > 0) {
                    processData(data);
                    document.getElementById('loadingStatus').style.display = 'none';
                } else {
                    showError('No data found in spreadsheet.');
                }
            } catch (error) {
                showError('Unable to load data. Please ensure the spreadsheet is publicly shared (anyone with link can view).');
                console.error('Fetch error:', error);
            }
        }

        function processData(data) {
            // The data comes with headers: Date, Day, AM Push-Ups, PM Push-Ups, Total, Notes
            // We need the Date (column 0) and Total (column 4)
            const processedData = data.map(row => {
                return {
                    date: row['Date'] || '',
                    total: parseInt(row['Total']) || 0
                };
            }).filter(item => item.date && item.total > 0);

            if (processedData.length === 0) {
                showError('No valid data found. Please check your spreadsheet format.');
                return;
            }

            const total = processedData.reduce((sum, item) => sum + item.total, 0);
            const average = Math.round(total / processedData.length);
            const bestDay = Math.max(...processedData.map(item => item.total));
            
            let streak = 0;
            for (let i = processedData.length - 1; i >= 0; i--) {
                if (processedData[i].total > 0) {
                    streak++;
                } else {
                    break;
                }
            }

            document.getElementById('totalPushUps').textContent = total;
            document.getElementById('averagePushUps').textContent = average;
            document.getElementById('bestDay').textContent = bestDay;
            document.getElementById('streak').textContent = streak + ' days';

            const labels = processedData.map(item => item.date);
            const pushupCounts = processedData.map(item => item.total);

            renderDailyChart(labels, pushupCounts);
            renderWeeklyChart(processedData);
        }

        function renderDailyChart(labels, data) {
            const ctx = document.getElementById('pushUpsChart').getContext('2d');
            
            if (dailyChart) {
                dailyChart.destroy();
            }
            
            dailyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Daily Push Ups',
                        data: data,
                        borderColor: '#4a7fff',
                        backgroundColor: 'rgba(74, 127, 255, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 5,
                        pointBackgroundColor: '#4a7fff',
                        pointBorderColor: '#1a1a1a',
                        pointBorderWidth: 2,
                        pointHoverRadius: 7,
                        pointHoverBackgroundColor: '#667eea'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                color: '#e0e0e0',
                                font: { size: 12 }
                            }
                        },
                        filler: {
                            propagate: true
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: '#a0a0a0',
                                stepSize: Math.max(1, Math.ceil(Math.max(...data) / 5))
                            },
                            grid: {
                                color: '#2a2a2a',
                                drawBorder: false
                            }
                        },
                        x: {
                            ticks: {
                                color: '#a0a0a0'
                            },
                            grid: {
                                color: '#2a2a2a',
                                drawBorder: false
                            }
                        }
                    }
                }
            });
        }

        function renderWeeklyChart(data) {
            const weeklyData = {};
            const weekLabels = {};
            
            data.forEach(item => {
                // Parse date in format "D-MMM-YYYY" (1-Jan-2026)
                const dateParts = item.date.split('-');
                const monthMap = {
                    'Jan': 0, 'Feb': 1, 'Mar': 2, 'Apr': 3, 'May': 4, 'Jun': 5,
                    'Jul': 6, 'Aug': 7, 'Sep': 8, 'Oct': 9, 'Nov': 10, 'Dec': 11
                };
                const date = new Date(2026, monthMap[dateParts[1]], parseInt(dateParts[0]));
                const weekStart = new Date(date);
                weekStart.setDate(date.getDate() - date.getDay());
                const weekKey = weekStart.toISOString().split('T')[0];
                
                if (!weeklyData[weekKey]) {
                    weeklyData[weekKey] = 0;
                    weekLabels[weekKey] = `Week of ${weekKey}`;
                }
                weeklyData[weekKey] += item.total;
            });

            const weeks = Object.keys(weeklyData).sort();
            const weeklyCounts = weeks.map(week => weeklyData[week]);
            const weekLabelsList = weeks.map(week => weekLabels[week]);

            const ctx = document.getElementById('weeklyChart').getContext('2d');
            
            if (weeklyChart) {
                weeklyChart.destroy();
            }
            
            weeklyChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: weekLabelsList,
                    datasets: [{
                        label: 'Weekly Total Push Ups',
                        data: weeklyCounts,
                        backgroundColor: 'rgba(74, 127, 255, 0.7)',
                        borderColor: '#4a7fff',
                        borderWidth: 2,
                        borderRadius: 6,
                        hoverBackgroundColor: 'rgba(102, 126, 234, 0.9)'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                color: '#e0e0e0',
                                font: { size: 12 }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: '#a0a0a0'
                            },
                            grid: {
                                color: '#2a2a2a',
                                drawBorder: false
                            }
                        },
                        x: {
                            ticks: {
                                color: '#a0a0a0'
                            },
                            grid: {
                                color: '#2a2a2a',
                                drawBorder: false
                            }
                        }
                    }
                }
            });
        }

        function showError(message) {
            document.getElementById('loadingStatus').innerHTML = `<strong>⚠️ Error:</strong> ${message}`;
            document.getElementById('loadingStatus').classList.remove('alert-info');
            document.getElementById('loadingStatus').classList.add('alert-danger');
        }

        window.addEventListener('load', fetchDataFromSheet);
    </script>
</body>
</html>
