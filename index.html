<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Push Ups Challenge Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .dashboard-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 40px 20px;
            margin-top: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .stat-card h3 {
            font-size: 14px;
            margin-bottom: 10px;
            opacity: 0.9;
            font-weight: 600;
        }
        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            margin: 10px 0;
        }
        .chart-container {
            position: relative;
            height: 400px;
            margin: 30px 0;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 28px;
        }
        .header-subtitle {
            color: rgba(255,255,255,0.9);
            text-align: center;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .section-title {
            color: #333;
            margin-top: 30px;
            margin-bottom: 20px;
            font-weight: 600;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .alert {
            border-radius: 8px;
        }
        @media (max-width: 768px) {
            .dashboard-container {
                padding: 20px 15px;
            }
            h1 {
                font-size: 24px;
            }
            .stat-card {
                padding: 15px;
            }
            .stat-card .number {
                font-size: 28px;
            }
            .chart-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h1>🔥 2026 Push Ups Challenge</h1>
        <p class="header-subtitle">Track your daily progress and stay motivated!</p>
        
        <div class="dashboard-container">
            <div class="row">
                <div class="col-md-3 col-6">
                    <div class="stat-card">
                        <h3>Total Push Ups</h3>
                        <div class="number" id="totalPushUps">-</div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="stat-card">
                        <h3>Average Daily</h3>
                        <div class="number" id="averagePushUps">-</div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="stat-card">
                        <h3>Best Day</h3>
                        <div class="number" id="bestDay">-</div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="stat-card">
                        <h3>Current Streak</h3>
                        <div class="number" id="streak">-</div>
                    </div>
                </div>
            </div>

            <h2 class="section-title">Daily Progress</h2>
            <div class="chart-container">
                <canvas id="pushUpsChart"></canvas>
            </div>

            <h2 class="section-title">Weekly Breakdown</h2>
            <div class="chart-container">
                <canvas id="weeklyChart"></canvas>
            </div>

            <div class="alert alert-info" id="loadingStatus">
                <strong>Loading data...</strong> Pulling your latest push up data from the spreadsheet.
            </div>
        </div>
    </div>

    <script>
        let dailyChart = null;
        let weeklyChart = null;

        async function fetchDataFromSheet() {
            const sheetID = '14KN-KDPbNyXk-lSJ_yNqx4LhIdgiUp2lwoHEsEmJiPQ';
            const sheetName = 'Sheet1'; // Update if your sheet tab has a different name
            
            try {
                // Using OpenSheet API - no API key required, no setup needed
                const apiUrl = `https://opensheet.elk.sh/${sheetID}/${sheetName}`;
                
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error('Failed to fetch data');
                }
                
                const data = await response.json();

                if (data && data.length > 0) {
                    processData(data);
                    document.getElementById('loadingStatus').style.display = 'none';
                } else {
                    showError('No data found in spreadsheet.');
                }
            } catch (error) {
                showError('Unable to load data. Please ensure the spreadsheet is publicly shared (anyone with link can view).');
                console.error('Fetch error:', error);
            }
        }

        function processData(data) {
            // Convert data - assuming first column is date, second is push-ups
            const processedData = data.map(row => {
                // Get first two values regardless of column names
                const values = Object.values(row);
                return {
                    date: values[0] || '',
                    pushups: parseInt(values[1]) || 0
                };
            }).filter(item => item.date && item.pushups > 0);

            if (processedData.length === 0) {
                showError('No valid data found. Please check your spreadsheet format.');
                return;
            }

            const total = processedData.reduce((sum, item) => sum + item.pushups, 0);
            const average = Math.round(total / processedData.length);
            const bestDay = Math.max(...processedData.map(item => item.pushups));
            
            let streak = 0;
            for (let i = processedData.length - 1; i >= 0; i--) {
                if (processedData[i].pushups > 0) {
                    streak++;
                } else {
                    break;
                }
            }

            document.getElementById('totalPushUps').textContent = total;
            document.getElementById('averagePushUps').textContent = average;
            document.getElementById('bestDay').textContent = bestDay;
            document.getElementById('streak').textContent = streak + ' days';

            const labels = processedData.map(item => item.date);
            const pushupCounts = processedData.map(item => item.pushups);

            renderDailyChart(labels, pushupCounts);
            renderWeeklyChart(processedData);
        }

        function renderDailyChart(labels, data) {
            const ctx = document.getElementById('pushUpsChart').getContext('2d');
            
            if (dailyChart) {
                dailyChart.destroy();
            }
            
            dailyChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Daily Push Ups',
                        data: data,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 5,
                        pointBackgroundColor: '#667eea',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointHoverRadius: 7
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                font: { size: 12 }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: Math.max(1, Math.ceil(Math.max(...data) / 5))
                            }
                        }
                    }
                }
            });
        }

        function renderWeeklyChart(data) {
            const weeklyData = {};
            const weekLabels = {};
            
            data.forEach(item => {
                const date = new Date(item.date);
                const weekStart = new Date(date);
                weekStart.setDate(date.getDate() - date.getDay());
                const weekKey = weekStart.toISOString().split('T')[0];
                
                if (!weeklyData[weekKey]) {
                    weeklyData[weekKey] = 0;
                    weekLabels[weekKey] = `Week of ${weekKey}`;
                }
                weeklyData[weekKey] += item.pushups;
            });

            const weeks = Object.keys(weeklyData).sort();
            const weeklyCounts = weeks.map(week => weeklyData[week]);
            const weekLabelsList = weeks.map(week => weekLabels[week]);

            const ctx = document.getElementById('weeklyChart').getContext('2d');
            
            if (weeklyChart) {
                weeklyChart.destroy();
            }
            
            weeklyChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: weekLabelsList,
                    datasets: [{
                        label: 'Weekly Total Push Ups',
                        data: weeklyCounts,
                        backgroundColor: 'rgba(118, 75, 162, 0.8)',
                        borderColor: '#764ba2',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                font: { size: 12 }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function showError(message) {
            document.getElementById('loadingStatus').innerHTML = `<strong>⚠️ Error:</strong> ${message}`;
            document.getElementById('loadingStatus').classList.remove('alert-info');
            document.getElementById('loadingStatus').classList.add('alert-danger');
        }

        window.addEventListener('load', fetchDataFromSheet);
    </script>
</body>
</html>
